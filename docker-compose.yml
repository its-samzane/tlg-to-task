services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://tlg:tlg@db:5432/tlg_to_task
      STORAGE_DIR: /app/storage
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tlg
      POSTGRES_PASSWORD: tlg
      POSTGRES_DB: tlg_to_task
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tlg -d tlg_to_task']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
